<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<title>Parábola · Scanner de Preços</title>
<script src="books.js"></script>
<script src="vendor/tf.min.js" defer></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0b0d12; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#fff; }

  #stage { position:fixed; inset:0; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  .topbar {
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    background:linear-gradient(to bottom, rgba(0,0,0,.65), transparent);
  }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; letter-spacing:.3px; }
  .brand .dot { width:9px; height:9px; border-radius:50%; background:#666; transition:background .3s; }
  .brand .dot.live { background:#22e06c; box-shadow:0 0 10px #22e06c; }
  .modechip {
    font-size:10px; font-weight:700; padding:3px 8px; border-radius:8px;
    background:rgba(255,255,255,.12); color:rgba(255,255,255,.6); letter-spacing:.4px;
  }
  .modechip.visao { background:rgba(142,160,255,.25); color:#b8c4ff; }
  .topbtns { display:flex; gap:8px; }
  .iconbtn {
    width:40px; height:40px; border-radius:12px; border:1px solid rgba(255,255,255,.15);
    background:rgba(20,22,30,.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    color:#fff; font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .iconbtn.on { background:#ffb020; color:#111; border-color:#ffb020; }

  /* ---- AR cards ---- */
  .arcard {
    position:absolute; z-index:15; pointer-events:none;
    transform:translate(-50%, -100%);
    display:flex; gap:11px; align-items:center;
    min-width:220px; max-width:300px;
    background:rgba(13,15,22,.85);
    backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4);
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px; padding:11px 13px;
    box-shadow:0 10px 40px rgba(0,0,0,.55);
    will-change:left, top;
  }
  .arcard::after {
    content:''; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%) rotate(45deg);
    width:12px; height:12px; background:rgba(13,15,22,.85);
    border-right:1px solid rgba(255,255,255,.14); border-bottom:1px solid rgba(255,255,255,.14);
  }
  .arcard.appear { animation:pop .28s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { opacity:0; transform:translate(-50%,-100%) scale(.7); } to { opacity:1; transform:translate(-50%,-100%) scale(1); } }
  .arcard img.cover { width:52px; height:64px; object-fit:cover; border-radius:8px; flex:none; background:#222; }
  .arcard .t { font-size:12.5px; font-weight:600; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .arcard .prices { display:flex; align-items:baseline; gap:7px; margin-top:4px; flex-wrap:wrap; }
  .arcard .main { font-size:23px; font-weight:800; color:#ffb020; letter-spacing:-.5px; }
  .arcard .old { font-size:12px; color:rgba(255,255,255,.45); text-decoration:line-through; }
  .arcard .badge { font-size:9.5px; font-weight:800; background:#22e06c; color:#052; padding:2px 6px; border-radius:6px; }
  .arcard .badge.out { background:#e05555; color:#fff; }
  .arcard .isbn { font-size:9.5px; color:rgba(255,255,255,.4); font-family:ui-monospace,monospace; margin-top:4px; }
  .arcard.unknown .main { color:#8ea0ff; font-size:15px; font-weight:600; }

  /* card do reconhecimento por capa (sem bbox: ancora no centro) */
  .arcard.vision { transform:translate(-50%,0); animation:none; }
  .arcard.vision::after { display:none; }
  .arcard .conf { font-size:9.5px; color:#b8c4ff; margin-top:3px; font-weight:700; }

  /* ---- bottom sheet ---- */
  .sheet {
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    background:rgba(13,15,22,.9); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.1);
    border-radius:20px 20px 0 0;
    transform:translateY(calc(100% - 58px));
    transition:transform .35s cubic-bezier(.3,1,.3,1);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .sheet.open { transform:translateY(0); }
  .sheet-head { position:relative; display:flex; align-items:center; justify-content:space-between; padding:10px 18px 12px; cursor:pointer; user-select:none; }
  .sheet-head .grab { position:absolute; top:6px; left:50%; transform:translateX(-50%); width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,.25); }
  .sheet-title { font-size:13px; font-weight:700; color:rgba(255,255,255,.85); margin-top:6px; }
  .sheet-total { font-size:15px; font-weight:800; color:#ffb020; margin-top:6px; }
  .sheet-body { max-height:42vh; overflow-y:auto; padding:0 14px 16px; }
  .hitem {
    display:flex; align-items:center; gap:10px;
    padding:8px 10px; margin-bottom:8px; border-radius:12px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.07);
  }
  .hitem img { width:34px; height:44px; object-fit:cover; border-radius:6px; flex:none; background:#222; }
  .hitem .hmid { flex:1; min-width:0; }
  .hitem .ht { font-size:12.5px; font-weight:600; line-height:1.3; }
  .hitem .hi { font-size:10px; color:rgba(255,255,255,.4); font-family:ui-monospace,monospace; margin-top:2px; }
  .hitem .hp { font-size:15px; font-weight:800; color:#ffb020; white-space:nowrap; }
  .hclear { width:100%; padding:10px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:transparent; color:rgba(255,255,255,.7); font-size:13px; cursor:pointer; }

  /* ---- gate ---- */
  .gate {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:radial-gradient(120% 90% at 50% 0%, #1a1e2e 0%, #0b0d12 70%); text-align:center; padding:32px;
  }
  .gate h1 { font-size:26px; font-weight:800; letter-spacing:-.5px; }
  .gate h1 span { color:#ffb020; }
  .gate p { font-size:14px; color:rgba(255,255,255,.55); max-width:310px; line-height:1.5; }
  .gate .go {
    margin-top:8px; padding:16px 42px; border:none; border-radius:16px; cursor:pointer;
    font-size:17px; font-weight:800; color:#111; background:#ffb020;
    box-shadow:0 8px 30px rgba(255,176,32,.35);
  }
  .gate .go:disabled { opacity:.6; }
  .gate .stat { font-size:12px; color:rgba(255,255,255,.35); min-height:16px; }
  .gate .cachebar { width:220px; height:4px; border-radius:2px; background:rgba(255,255,255,.12); overflow:hidden; }
  .gate .cachebar > div { height:100%; width:0%; background:#ffb020; transition:width .3s; }
  .gate.hidden { display:none; }

  #toast {
    position:absolute; top:calc(env(safe-area-inset-top, 0px) + 64px); left:50%; transform:translateX(-50%);
    z-index:30; background:rgba(200,40,40,.92); padding:10px 18px; border-radius:12px;
    font-size:13px; font-weight:600; opacity:0; transition:opacity .3s; pointer-events:none; max-width:85vw; text-align:center;
  }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>Parábola <span>Scanner</span></h1>
  <p>De perto lê o <b>código de barras</b> (contracapa). De longe reconhece o livro pela <b>capa</b>. Preço na tela em tempo real — funciona até sem sinal depois do primeiro acesso.</p>
  <button class="go" id="startBtn">Ligar câmera</button>
  <div class="cachebar" id="cachebar" style="display:none"><div id="cachefill"></div></div>
  <div class="stat" id="engineStat"></div>
</div>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div class="topbar">
    <div class="brand"><div class="dot" id="liveDot"></div> Parábola <span class="modechip" id="modeChip">CÓDIGO</span></div>
    <div class="topbtns">
      <button class="iconbtn" id="torchBtn" style="display:none" aria-label="Lanterna">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
      </button>
    </div>
  </div>

  <div id="toast"></div>
  <div id="cards"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-head" id="sheetHead">
      <div class="grab"></div>
      <div class="sheet-title" id="sheetCount">Nenhum livro lido ainda</div>
      <div class="sheet-total" id="sheetTotal"></div>
    </div>
    <div class="sheet-body">
      <div id="historyList"></div>
      <button class="hclear" id="clearBtn">Limpar lista</button>
    </div>
  </div>
</div>

<script src="vendor/zxing.min.js" defer></script>
<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const cardsEl = document.getElementById('cards');
const fmt = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
const brl0 = v => 'R$ ' + v.toFixed(2).replace('.', ',');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const hasNative = 'BarcodeDetector' in window;
document.getElementById('engineStat').textContent = hasNative
  ? 'código: motor nativo · capa: MobileNet local'
  : 'código: ZXing · capa: MobileNet local';

// ================= service worker: pré-carrega TUDO no cache =================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    navigator.serviceWorker.addEventListener('message', ev => {
      if (ev.data && ev.data.type === 'precache-progress') {
        const bar = document.getElementById('cachebar');
        bar.style.display = 'block';
        document.getElementById('cachefill').style.width = (100 * ev.data.done / ev.data.total) + '%';
        if (ev.data.done >= ev.data.total) {
          document.getElementById('engineStat').textContent = 'tudo em cache — funciona offline';
          setTimeout(() => bar.style.display = 'none', 1500);
        }
      }
    });
  }).catch(() => {});
}

// ================= tracked barcodes =================
const tracks = new Map();
const TRACK_TTL = 900, LERP = 0.35;
const history = [];
const seenSession = new Set();

function lookupBook(code) {
  const b = BOOKS[code];
  if (!b) return { known:false };
  return { known:true, title:b.t, priceSite:b.p, cover:b.pc, price20:b.d, out:b.e, cat:b.c };
}

function mapRect(x, y, w, h) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const ew = overlay.width / devicePixelRatio, eh = overlay.height / devicePixelRatio;
  const s = Math.max(ew / vw, eh / vh);
  const ox = (ew - vw * s) / 2, oy = (eh - vh * s) / 2;
  return { x: x * s + ox, y: y * s + oy, w: w * s, h: h * s };
}

let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 1420; o.type = 'sine';
    g.gain.setValueAtTime(.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .12);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + .13);
  } catch(e) {}
  if (navigator.vibrate) navigator.vibrate(40);
}

function priceBlock(info, code) {
  if (!info.known) {
    return `<div class="t">Fora do catálogo Parábola</div>
      <div class="prices"><span class="main">sem preço</span></div>
      <div class="isbn">${code}</div>`;
  }
  const main = info.price20 != null ? info.price20 : info.priceSite;
  const old = info.price20 != null ? (info.cover != null ? info.cover : info.priceSite) : null;
  return `<div class="t">${esc(info.title)}</div>
    <div class="prices">
      <span class="main">${brl0(main)}</span>
      ${old != null ? `<span class="old">${brl0(old)}</span><span class="badge">-20%</span>` : ''}
      ${info.out ? '<span class="badge out">esgotado</span>' : ''}
    </div>
    <div class="isbn">${code}</div>`;
}

function makeCard(code, info, vision = false, conf = 0) {
  const el = document.createElement('div');
  el.className = 'arcard appear' + (info.known ? '' : ' unknown') + (vision ? ' vision' : '');
  el.innerHTML = (info.known ? `<img class="cover" src="thumbs/${code}.jpg" alt="">` : '') +
    `<div>${priceBlock(info, code)}${vision ? `<div class="conf">pela capa · ${Math.round(conf * 100)}%</div>` : ''}</div>`;
  cardsEl.appendChild(el);
  return el;
}

function addHistory(code, info) {
  if (!info.known) return;
  history.unshift({ isbn: code, title: info.title, price: info.price20 != null ? info.price20 : info.priceSite });
  renderHistory();
}

function registerDetection(code, rawBox) {
  if (!/^\d{8,13}$/.test(code)) return;
  lastBarcodeAt = performance.now();
  clearVisionCard();
  const now = performance.now();
  let tr = tracks.get(code);
  const box = mapRect(rawBox.x, rawBox.y, rawBox.w, rawBox.h);
  if (!tr) {
    const info = lookupBook(code);
    tr = { box: {...box}, target: box, lastSeen: now, el: makeCard(code, info), info };
    tracks.set(code, tr);
    if (!seenSession.has(code)) {
      seenSession.add(code);
      beep();
      addHistory(code, info);
    }
  } else {
    tr.target = box; tr.lastSeen = now;
  }
}

// ================= render loop =================
function renderLoop() {
  const now = performance.now(), dpr = devicePixelRatio;
  octx.clearRect(0, 0, overlay.width, overlay.height);
  for (const [code, tr] of tracks) {
    const age = now - tr.lastSeen;
    if (age > TRACK_TTL) { tr.el.remove(); tracks.delete(code); continue; }
    tr.box.x += (tr.target.x - tr.box.x) * LERP;
    tr.box.y += (tr.target.y - tr.box.y) * LERP;
    tr.box.w += (tr.target.w - tr.box.w) * LERP;
    tr.box.h += (tr.target.h - tr.box.h) * LERP;
    const fade = age > TRACK_TTL - 250 ? (TRACK_TTL - age) / 250 : 1;
    const b = tr.box;
    octx.save();
    octx.globalAlpha = fade;
    octx.strokeStyle = tr.info.known ? '#ffb020' : '#8ea0ff';
    octx.lineWidth = 3 * dpr;
    octx.shadowColor = octx.strokeStyle;
    octx.shadowBlur = 14 * dpr;
    roundRect(octx, (b.x-6)*dpr, (b.y-6)*dpr, (b.w+12)*dpr, (b.h+12)*dpr, 10*dpr);
    octx.stroke();
    octx.restore();
    tr.el.style.opacity = fade;
    tr.el.style.left = (b.x + b.w/2) + 'px';
    tr.el.style.top = Math.max(70, b.y - 14) + 'px';
  }
  requestAnimationFrame(renderLoop);
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

// ================= barcode: native =================
let running = false, lastBarcodeAt = 0;
async function nativeLoop(detector) {
  while (running) {
    try {
      const codes = await detector.detect(video);
      for (const c of codes) {
        const bb = c.boundingBox;
        registerDetection(c.rawValue, { x:bb.x, y:bb.y, w:bb.width, h:bb.height });
      }
    } catch(e) {}
    await new Promise(r => setTimeout(r, 60));
  }
}

// ================= barcode: ZXing fallback =================
function zxingLoop() {
  if (typeof ZXing === 'undefined') { setTimeout(zxingLoop, 300); return; }
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const reader = new ZXing.MultiFormatReader();
  reader.setHints(hints);
  const cv = document.createElement('canvas');
  const cctx = cv.getContext('2d', { willReadFrequently:true });
  function tick() {
    if (!running) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      const scale = Math.min(1, 900 / video.videoWidth);
      cv.width = video.videoWidth * scale; cv.height = video.videoHeight * scale;
      cctx.drawImage(video, 0, 0, cv.width, cv.height);
      try {
        const lum = new ZXing.HTMLCanvasElementLuminanceSource(cv);
        const bin = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
        const res = reader.decodeWithState(bin);
        if (res) {
          const pts = res.getResultPoints();
          const xs = pts.map(p => p.getX()/scale), ys = pts.map(p => p.getY()/scale);
          const minX = Math.min(...xs), maxX = Math.max(...xs);
          const midY = ys.reduce((a,b) => a+b, 0) / ys.length;
          const w = Math.max(maxX - minX, 60);
          registerDetection(res.getText(), { x:minX, y:midY - w*0.35, w, h:w*0.7 });
        }
      } catch(e) {}
    }
    setTimeout(tick, 90);
  }
  tick();
}

// ================= reconhecimento por CAPA (MobileNet local) =================
let visionModel = null, embMat = null, embIsbns = null, embDim = 256;
let visionCard = null, visionCode = null, visionPending = null;
const VISION_SIM = 0.72;     // similaridade mínima
const VISION_MARGIN = 0.015; // distância mínima pro 2º colocado
const VISION_TICK = 200;     // ms entre leituras de capa
const BARCODE_IDLE = 600;    // ms sem código pra entrar em modo capa
const modeChip = document.getElementById('modeChip');

async function loadVision() {
  try {
    await new Promise(res => {
      const t = setInterval(() => { if (window.tf) { clearInterval(t); res(); } }, 100);
    });
    try { await tf.setBackend('webgl'); } catch(e) { await tf.setBackend('cpu'); }
    await tf.ready();
    const [model, embMeta, embBuf] = await Promise.all([
      tf.loadLayersModel('model/model.json'),
      fetch('embeddings.json').then(r => r.json()),
      fetch('embeddings.bin').then(r => r.arrayBuffer()),
    ]);
    const layer = model.getLayer('conv_pw_13_relu');
    visionModel = tf.model({ inputs: model.inputs, outputs: layer.output });
    embMat = new Float32Array(embBuf);
    embIsbns = embMeta.isbns;
    embDim = embMeta.dim;
    // warmup
    tf.tidy(() => visionModel.predict(tf.zeros([1,224,224,3])));
    visionLoop();
  } catch(e) {
    console.log('visão indisponível:', e);
  }
}

const vcv = document.createElement('canvas');
vcv.width = 224; vcv.height = 224;
const vctx = vcv.getContext('2d', { willReadFrequently:true });

async function embedFrame() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const side = Math.min(vw, vh);
  vctx.drawImage(video, (vw-side)/2, (vh-side)/2, side, side, 0, 0, 224, 224);
  const q = tf.tidy(() => {
    const t = tf.browser.fromPixels(vcv).toFloat().div(127.5).sub(1).expandDims(0);
    const f = visionModel.predict(t);
    const v = f.mean([1,2]).squeeze();
    return v.div(v.norm());
  });
  const data = await q.data();
  q.dispose();
  return data;
}

function bestMatch(q) {
  let best = -2, second = -2, bestIdx = -1;
  const N = embIsbns.length;
  for (let j = 0; j < N; j++) {
    let s = 0;
    const off = j * embDim;
    for (let d = 0; d < embDim; d++) s += q[d] * embMat[off + d];
    if (s > best) { second = best; best = s; bestIdx = j; }
    else if (s > second) second = s;
  }
  return { isbn: embIsbns[bestIdx], sim: best, margin: best - second };
}

function clearVisionCard() {
  if (visionCard) { visionCard.remove(); visionCard = null; visionCode = null; }
  visionPending = null;
  modeChip.textContent = 'CÓDIGO';
  modeChip.classList.remove('visao');
}

async function visionLoop() {
  while (running) {
    const idleSinceBarcode = performance.now() - lastBarcodeAt > BARCODE_IDLE;
    if (idleSinceBarcode && video.readyState === video.HAVE_ENOUGH_DATA) {
      try {
        const q = await embedFrame();
        const m = bestMatch(q);
        if (m.sim >= VISION_SIM && m.margin >= VISION_MARGIN) {
          // exige 2 leituras seguidas do MESMO livro pra confirmar
          if (visionPending === m.isbn || visionCode === m.isbn) {
            showVisionCard(m);
          } else {
            visionPending = m.isbn;
          }
        } else {
          visionPending = null;
          if (visionCard && m.sim < VISION_SIM - 0.05) clearVisionCard();
        }
      } catch(e) {}
    } else if (!idleSinceBarcode && visionCard) {
      clearVisionCard();
    }
    await new Promise(r => setTimeout(r, VISION_TICK));
  }
}

function showVisionCard(m) {
  modeChip.textContent = 'CAPA';
  modeChip.classList.add('visao');
  if (visionCode === m.isbn && visionCard) {
    const c = visionCard.querySelector('.conf');
    if (c) c.textContent = `pela capa · ${Math.round(m.sim * 100)}%`;
    return;
  }
  clearVisionCard();
  modeChip.textContent = 'CAPA'; modeChip.classList.add('visao');
  const info = lookupBook(m.isbn);
  visionCard = makeCard(m.isbn, info, true, m.sim);
  visionCard.style.left = '50%';
  visionCard.style.top = 'calc(env(safe-area-inset-top, 0px) + 70px)';
  visionCode = m.isbn;
  if (!seenSession.has(m.isbn)) {
    seenSession.add(m.isbn);
    beep();
    addHistory(m.isbn, info);
  }
}

// ================= camera =================
let track = null;
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } },
    audio: false
  });
  video.srcObject = stream;
  track = stream.getVideoTracks()[0];
  await new Promise(r => video.onloadedmetadata = r);
  await video.play();
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) {
      const tb = document.getElementById('torchBtn');
      tb.style.display = 'flex';
      let on = false;
      tb.onclick = () => {
        on = !on; tb.classList.toggle('on', on);
        track.applyConstraints({ advanced:[{ torch:on }] }).catch(() => {});
      };
    }
  } catch(e) {}
  resizeOverlay();
  running = true;
  document.getElementById('liveDot').classList.add('live');
  if (hasNative) {
    nativeLoop(new BarcodeDetector({ formats:['ean_13','ean_8','upc_a','upc_e','code_128'] }));
  } else {
    zxingLoop();
  }
  loadVision();
  renderLoop();
}

function resizeOverlay() {
  overlay.width = overlay.clientWidth * devicePixelRatio;
  overlay.height = overlay.clientHeight * devicePixelRatio;
}
window.addEventListener('resize', resizeOverlay);
window.addEventListener('orientationchange', () => setTimeout(resizeOverlay, 300));

// ================= history =================
const sheet = document.getElementById('sheet');
document.getElementById('sheetHead').onclick = () => sheet.classList.toggle('open');
document.getElementById('clearBtn').onclick = (e) => {
  e.stopPropagation();
  history.length = 0; seenSession.clear(); renderHistory();
};
function renderHistory() {
  const list = document.getElementById('historyList');
  const total = history.reduce((a,b) => a + b.price, 0);
  document.getElementById('sheetCount').textContent = history.length
    ? `${history.length} livro${history.length>1?'s':''}`
    : 'Nenhum livro lido ainda';
  document.getElementById('sheetTotal').textContent = history.length ? fmt.format(total) : '';
  list.innerHTML = history.map(h => `
    <div class="hitem">
      <img src="thumbs/${h.isbn}.jpg" alt="" loading="lazy">
      <div class="hmid"><div class="ht">${esc(h.title)}</div><div class="hi">${h.isbn}</div></div>
      <div class="hp">${brl0(h.price)}</div>
    </div>`).join('');
}

function toast(msg, ms = 3500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

document.getElementById('startBtn').onclick = async () => {
  const btn = document.getElementById('startBtn');
  btn.disabled = true; btn.textContent = 'Abrindo câmera…';
  try {
    await startCamera();
    document.getElementById('gate').classList.add('hidden');
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Ligar câmera';
    if (location.protocol === 'http:' && !['localhost','127.0.0.1'].includes(location.hostname)) {
      toast('Câmera exige HTTPS. Acesse pelo domínio com https://', 6000);
    } else if (err.name === 'NotAllowedError') {
      toast('Permissão negada. Libere a câmera nas configurações do navegador.', 6000);
    } else {
      toast('Erro na câmera: ' + err.message, 6000);
    }
  }
};
</script>
