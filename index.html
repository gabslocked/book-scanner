<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Parábola · Scanner de Preços</title>
<script src="books.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0b0d12; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#fff; }

  #stage { position:fixed; inset:0; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* ---- top bar ---- */
  .topbar {
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    background:linear-gradient(to bottom, rgba(0,0,0,.65), transparent);
  }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; letter-spacing:.3px; }
  .brand .dot { width:9px; height:9px; border-radius:50%; background:#666; transition:background .3s; }
  .brand .dot.live { background:#22e06c; box-shadow:0 0 10px #22e06c; }
  .topbtns { display:flex; gap:8px; }
  .iconbtn {
    width:40px; height:40px; border-radius:12px; border:1px solid rgba(255,255,255,.15);
    background:rgba(20,22,30,.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    color:#fff; font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .iconbtn.on { background:#ffb020; color:#111; border-color:#ffb020; }

  /* ---- floating price cards (AR) ---- */
  .arcard {
    position:absolute; z-index:15; pointer-events:none;
    transform:translate(-50%, -100%);
    min-width:180px; max-width:270px;
    background:rgba(13,15,22,.82);
    backdrop-filter:blur(16px) saturate(1.4); -webkit-backdrop-filter:blur(16px) saturate(1.4);
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px; padding:12px 14px;
    box-shadow:0 10px 40px rgba(0,0,0,.55);
    transition:opacity .25s;
    will-change:left, top;
  }
  .arcard::after {
    content:''; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%) rotate(45deg);
    width:12px; height:12px; background:rgba(13,15,22,.82);
    border-right:1px solid rgba(255,255,255,.14); border-bottom:1px solid rgba(255,255,255,.14);
  }
  .arcard.appear { animation:pop .28s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { opacity:0; transform:translate(-50%,-100%) scale(.7); } to { opacity:1; transform:translate(-50%,-100%) scale(1); } }
  .arcard .t { font-size:13px; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .arcard .prices { display:flex; align-items:baseline; gap:8px; margin-top:6px; }
  .arcard .main { font-size:26px; font-weight:800; color:#ffb020; letter-spacing:-.5px; }
  .arcard .old { font-size:13px; color:rgba(255,255,255,.45); text-decoration:line-through; }
  .arcard .badge { font-size:10px; font-weight:800; background:#22e06c; color:#052; padding:2px 6px; border-radius:6px; }
  .arcard .isbn { font-size:10px; color:rgba(255,255,255,.4); font-family:ui-monospace,monospace; margin-top:5px; }
  .arcard.unknown .main { color:#8ea0ff; font-size:16px; font-weight:600; }

  /* ---- bottom sheet / history ---- */
  .sheet {
    position:absolute; left:0; right:0; bottom:0; z-index:20;
    background:rgba(13,15,22,.9); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.1);
    border-radius:20px 20px 0 0;
    transform:translateY(calc(100% - 58px));
    transition:transform .35s cubic-bezier(.3,1,.3,1);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .sheet.open { transform:translateY(0); }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; padding:10px 18px 12px; cursor:pointer; user-select:none; }
  .sheet-head .grab { position:absolute; top:6px; left:50%; transform:translateX(-50%); width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,.25); }
  .sheet-title { font-size:13px; font-weight:700; color:rgba(255,255,255,.85); margin-top:6px; }
  .sheet-total { font-size:15px; font-weight:800; color:#ffb020; margin-top:6px; }
  .sheet-body { max-height:42vh; overflow-y:auto; padding:0 14px 16px; }
  .hitem {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 12px; margin-bottom:8px; border-radius:12px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.07);
  }
  .hitem .ht { font-size:12.5px; font-weight:600; line-height:1.3; }
  .hitem .hi { font-size:10px; color:rgba(255,255,255,.4); font-family:ui-monospace,monospace; margin-top:2px; }
  .hitem .hp { font-size:15px; font-weight:800; color:#ffb020; white-space:nowrap; }
  .hclear { width:100%; padding:10px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:transparent; color:rgba(255,255,255,.7); font-size:13px; cursor:pointer; }

  /* ---- start / permission screen ---- */
  .gate {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; background:radial-gradient(120% 90% at 50% 0%, #1a1e2e 0%, #0b0d12 70%); text-align:center; padding:32px;
  }
  .gate h1 { font-size:26px; font-weight:800; letter-spacing:-.5px; }
  .gate h1 span { color:#ffb020; }
  .gate p { font-size:14px; color:rgba(255,255,255,.55); max-width:300px; line-height:1.5; }
  .gate .go {
    margin-top:8px; padding:16px 42px; border:none; border-radius:16px; cursor:pointer;
    font-size:17px; font-weight:800; color:#111; background:#ffb020;
    box-shadow:0 8px 30px rgba(255,176,32,.35);
  }
  .gate .stat { font-size:12px; color:rgba(255,255,255,.35); }
  .gate.hidden { display:none; }

  #toast {
    position:absolute; top:calc(env(safe-area-inset-top, 0px) + 64px); left:50%; transform:translateX(-50%);
    z-index:30; background:rgba(200,40,40,.92); padding:10px 18px; border-radius:12px;
    font-size:13px; font-weight:600; opacity:0; transition:opacity .3s; pointer-events:none; max-width:85vw; text-align:center;
  }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>Parábola <span>Scanner</span></h1>
  <p>Aponte a câmera pros livros e veja o preço na hora, flutuando em cima do código de barras. Sem mira, sem alinhar — de qualquer ângulo.</p>
  <button class="go" id="startBtn">Ligar câmera</button>
  <div class="stat" id="engineStat"></div>
</div>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div class="topbar">
    <div class="brand"><div class="dot" id="liveDot"></div> Parábola Scanner</div>
    <div class="topbtns">
      <button class="iconbtn" id="torchBtn" style="display:none">🔦</button>
    </div>
  </div>

  <div id="toast"></div>
  <div id="cards"></div>

  <div class="sheet" id="sheet">
    <div class="sheet-head" id="sheetHead">
      <div class="grab"></div>
      <div class="sheet-title" id="sheetCount">Nenhum livro lido ainda</div>
      <div class="sheet-total" id="sheetTotal"></div>
    </div>
    <div class="sheet-body">
      <div id="historyList"></div>
      <button class="hclear" id="clearBtn">Limpar lista</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const cardsEl = document.getElementById('cards');
const fmt = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });

const BRL = v => fmt.format(v);
const brl0 = v => 'R$ ' + v.toFixed(2).replace('.', ',');

// ---------- engine detection ----------
const hasNative = 'BarcodeDetector' in window;
document.getElementById('engineStat').textContent = hasNative
  ? 'motor: nativo (BarcodeDetector) — máxima velocidade'
  : 'motor: ZXing (compatibilidade iPhone/Safari)';

// ---------- tracked codes: code -> track ----------
// track = { box:{x,y,w,h} smoothed, target:{...}, lastSeen, el, known }
const tracks = new Map();
const TRACK_TTL = 900;       // ms sem ver -> some
const LERP = 0.35;           // suavização do tracking

// ---------- history ----------
const history = [];          // {isbn, title, price}
const seenSession = new Set();

// ---------- external title cache (livros fora da tabela) ----------
const extCache = new Map();

function lookupBook(code) {
  if (BOOKS[code]) return { known:true, title:BOOKS[code].t, cover:BOOKS[code].p, price:BOOKS[code].d };
  return { known:false };
}

async function fetchExternalTitle(isbn) {
  if (extCache.has(isbn)) return extCache.get(isbn);
  extCache.set(isbn, null);
  try {
    const r = await fetch(`https://openlibrary.org/isbn/${isbn}.json`, { signal: AbortSignal.timeout(4000) });
    if (r.ok) {
      const j = await r.json();
      if (j.title) { extCache.set(isbn, j.title); return j.title; }
    }
  } catch(e) {}
  return null;
}

// ---------- coordinate mapping (video frame -> screen, object-fit: cover) ----------
function mapRect(x, y, w, h) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const ew = overlay.width / devicePixelRatio, eh = overlay.height / devicePixelRatio;
  const s = Math.max(ew / vw, eh / vh);
  const ox = (ew - vw * s) / 2, oy = (eh - vh * s) / 2;
  return { x: x * s + ox, y: y * s + oy, w: w * s, h: h * s };
}

// ---------- feedback ----------
let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 1420; o.type = 'sine';
    g.gain.setValueAtTime(.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .12);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + .13);
  } catch(e) {}
  if (navigator.vibrate) navigator.vibrate(40);
}

// ---------- card DOM ----------
function makeCard(code, info) {
  const el = document.createElement('div');
  el.className = 'arcard appear' + (info.known ? '' : ' unknown');
  if (info.known) {
    el.innerHTML = `
      <div class="t">${esc(info.title)}</div>
      <div class="prices">
        <span class="main">${brl0(info.price)}</span>
        <span class="old">${brl0(info.cover)}</span>
        <span class="badge">-20%</span>
      </div>
      <div class="isbn">${code}</div>`;
  } else {
    el.innerHTML = `
      <div class="t">Fora da tabela Parábola</div>
      <div class="prices"><span class="main">sem preço</span></div>
      <div class="isbn">${code}</div>`;
    if (/^97[89]/.test(code)) {
      fetchExternalTitle(code).then(t => {
        if (t && el.isConnected) el.querySelector('.t').textContent = t + ' (fora da tabela)';
      });
    }
  }
  cardsEl.appendChild(el);
  return el;
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- register a detection ----------
function registerDetection(code, rawBox) {
  if (!/^\d{8,13}$/.test(code)) return;
  const now = performance.now();
  let tr = tracks.get(code);
  const box = mapRect(rawBox.x, rawBox.y, rawBox.w, rawBox.h);
  if (!tr) {
    const info = lookupBook(code);
    tr = { box: {...box}, target: box, lastSeen: now, el: makeCard(code, info), info };
    tracks.set(code, tr);
    if (!seenSession.has(code)) {
      seenSession.add(code);
      beep();
      if (info.known) {
        history.unshift({ isbn: code, title: info.title, price: info.price });
        renderHistory();
      }
    }
  } else {
    tr.target = box;
    tr.lastSeen = now;
  }
}

// ---------- render loop (60fps, independent of detection rate) ----------
function renderLoop() {
  const now = performance.now();
  const dpr = devicePixelRatio;
  octx.clearRect(0, 0, overlay.width, overlay.height);

  for (const [code, tr] of tracks) {
    const age = now - tr.lastSeen;
    if (age > TRACK_TTL) {
      tr.el.remove();
      tracks.delete(code);
      continue;
    }
    // lerp smoothing
    tr.box.x += (tr.target.x - tr.box.x) * LERP;
    tr.box.y += (tr.target.y - tr.box.y) * LERP;
    tr.box.w += (tr.target.w - tr.box.w) * LERP;
    tr.box.h += (tr.target.h - tr.box.h) * LERP;

    const fade = age > TRACK_TTL - 250 ? (TRACK_TTL - age) / 250 : 1;
    const b = tr.box;

    // barcode highlight
    octx.save();
    octx.globalAlpha = fade;
    octx.strokeStyle = tr.info.known ? '#ffb020' : '#8ea0ff';
    octx.lineWidth = 3 * dpr;
    octx.shadowColor = tr.info.known ? '#ffb020' : '#8ea0ff';
    octx.shadowBlur = 14 * dpr;
    roundRect(octx, (b.x - 6) * dpr, (b.y - 6) * dpr, (b.w + 12) * dpr, (b.h + 12) * dpr, 10 * dpr);
    octx.stroke();
    octx.restore();

    // card anchored above barcode
    tr.el.style.opacity = fade;
    tr.el.style.left = (b.x + b.w / 2) + 'px';
    tr.el.style.top = Math.max(70, b.y - 14) + 'px';
  }
  requestAnimationFrame(renderLoop);
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// ---------- detection: native BarcodeDetector ----------
async function nativeLoop(detector) {
  while (running) {
    try {
      const codes = await detector.detect(video);
      for (const c of codes) {
        const bb = c.boundingBox;
        registerDetection(c.rawValue, { x: bb.x, y: bb.y, w: bb.width, h: bb.height });
      }
    } catch(e) {}
    await new Promise(r => setTimeout(r, 60)); // ~16 detecções/s
  }
}

// ---------- detection: ZXing fallback (iOS Safari) ----------
function zxingLoop() {
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128
  ]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  const reader = new ZXing.MultiFormatReader();
  reader.setHints(hints);
  const cv = document.createElement('canvas');
  const cctx = cv.getContext('2d', { willReadFrequently: true });

  function tick() {
    if (!running) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      const scale = Math.min(1, 900 / video.videoWidth);
      cv.width = video.videoWidth * scale;
      cv.height = video.videoHeight * scale;
      cctx.drawImage(video, 0, 0, cv.width, cv.height);
      try {
        const lum = new ZXing.HTMLCanvasElementLuminanceSource(cv);
        const bin = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
        const res = reader.decodeWithState(bin);
        if (res) {
          const pts = res.getResultPoints();
          const xs = pts.map(p => p.getX() / scale), ys = pts.map(p => p.getY() / scale);
          const minX = Math.min(...xs), maxX = Math.max(...xs);
          const midY = ys.reduce((a, b) => a + b, 0) / ys.length;
          const w = Math.max(maxX - minX, 60);
          registerDetection(res.getText(), { x: minX, y: midY - w * 0.35, w: w, h: w * 0.7 });
        }
      } catch(e) { /* not found this frame */ }
    }
    setTimeout(tick, 90);
  }
  tick();
}

// ---------- camera ----------
let running = false;
let track = null;

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1920 }, height: { ideal: 1080 }
    },
    audio: false
  });
  video.srcObject = stream;
  track = stream.getVideoTracks()[0];
  await new Promise(r => video.onloadedmetadata = r);
  await video.play();

  // torch support
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) {
      const tb = document.getElementById('torchBtn');
      tb.style.display = 'flex';
      let on = false;
      tb.onclick = () => {
        on = !on;
        tb.classList.toggle('on', on);
        track.applyConstraints({ advanced: [{ torch: on }] }).catch(() => {});
      };
    }
  } catch(e) {}

  resizeOverlay();
  running = true;
  document.getElementById('liveDot').classList.add('live');

  if (hasNative) {
    const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
    nativeLoop(detector);
  } else {
    zxingLoop();
  }
  renderLoop();
}

function resizeOverlay() {
  overlay.width = overlay.clientWidth * devicePixelRatio;
  overlay.height = overlay.clientHeight * devicePixelRatio;
}
window.addEventListener('resize', resizeOverlay);
window.addEventListener('orientationchange', () => setTimeout(resizeOverlay, 300));

// ---------- history sheet ----------
const sheet = document.getElementById('sheet');
document.getElementById('sheetHead').onclick = () => sheet.classList.toggle('open');
document.getElementById('clearBtn').onclick = (e) => {
  e.stopPropagation();
  history.length = 0;
  seenSession.clear();
  renderHistory();
};
function renderHistory() {
  const list = document.getElementById('historyList');
  const total = history.reduce((a, b) => a + b.price, 0);
  document.getElementById('sheetCount').textContent = history.length
    ? `${history.length} livro${history.length > 1 ? 's' : ''} lido${history.length > 1 ? 's' : ''}`
    : 'Nenhum livro lido ainda';
  document.getElementById('sheetTotal').textContent = history.length ? BRL(total) : '';
  list.innerHTML = history.map(h => `
    <div class="hitem">
      <div><div class="ht">${esc(h.title)}</div><div class="hi">${h.isbn}</div></div>
      <div class="hp">${brl0(h.price)}</div>
    </div>`).join('');
}

// ---------- toast ----------
function toast(msg, ms = 3500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

// ---------- start ----------
document.getElementById('startBtn').onclick = async () => {
  const btn = document.getElementById('startBtn');
  btn.disabled = true; btn.textContent = 'Abrindo câmera…';
  try {
    await startCamera();
    document.getElementById('gate').classList.add('hidden');
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Ligar câmera';
    if (location.protocol === 'http:' && !['localhost', '127.0.0.1'].includes(location.hostname)) {
      toast('Câmera exige HTTPS. Acesse pelo domínio com https://', 6000);
    } else if (err.name === 'NotAllowedError') {
      toast('Permissão negada. Libere a câmera nas configurações do navegador.', 6000);
    } else {
      toast('Erro na câmera: ' + err.message, 6000);
    }
  }
};
</script>
</body>
</html>
